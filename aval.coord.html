<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliação de Coordenadores</title>
<meta name="description" content="Resultado da avaliação dos coordenadores pelos docentes (Heavenly), por faixas e categorias.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f3a5f">
<style>/* Identidade visual herdada do painel original (variáveis, cartões, tema claro/escuro) */
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#667085;--line:#e4e0d6;--acc:#1f3a5f;--ok:#1f7a4d;--ad:#9a7b12;--at:#b42318;--okb:#e4f3ea;--adb:#faf1d2;--atb:#fde7e4;--c1:#2f6db5;--c2:#c9731a;--c3:#7a4fb0;--gold:#c9a227;--silver:#8a94a3;--bronze:#b0703a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161d;--card:#1a2029;--ink:#e8ebf0;--mut:#98a2b3;--line:#2a3340;--acc:#9bb8e0;--ok:#5fd09a;--ad:#e2c25a;--at:#ff8a7d;--okb:#163226;--adb:#352d10;--atb:#3a1c19;--c1:#6ea6ee;--c2:#f0a24d;--c3:#b794e8}}
:root[data-theme=dark]{--bg:#12161d;--card:#1a2029;--ink:#e8ebf0;--mut:#98a2b3;--line:#2a3340;--acc:#9bb8e0;--ok:#5fd09a;--ad:#e2c25a;--at:#ff8a7d;--okb:#163226;--adb:#352d10;--atb:#3a1c19;--c1:#6ea6ee;--c2:#f0a24d;--c3:#b794e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header img{height:34px;background:#1f3a5f;padding:4px 8px;border-radius:8px}h1{font-size:16px;margin:0}
.tag{background:var(--adb);color:var(--ad);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}.sp{flex:1}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--acc)}button.on{background:var(--acc);color:var(--card);border-color:var(--acc)}
button.q{padding:1px 8px;font-size:12px;border-radius:99px;color:var(--acc);font-weight:700}
nav.main{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:51px;z-index:4;overflow-x:auto}
nav.main button{white-space:nowrap}
main{max-width:1240px;margin:0 auto;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.box h2{font-size:15px;margin:0 0 6px}.box h3{font-size:14px;margin:12px 0 4px}.box ul{margin:6px 0 0;padding-left:18px}.box li{margin:3px 0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar b{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}.kpis div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.kpis b{font-size:22px;display:block}.kpis span{font-size:12px;color:var(--mut)}
.chip{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap;display:inline-block}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}.chip.ad{background:var(--adb);color:var(--ad);border-color:transparent}.chip.at{background:var(--atb);color:var(--at);border-color:transparent}
.at{background:var(--atb);color:var(--at)}.ad{background:var(--adb);color:var(--ad)}.ok{background:var(--okb);color:var(--ok)}.na{color:var(--mut);font-weight:400}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pc h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc .rule{font-size:11.5px;color:var(--mut)}
.slot{display:grid;grid-template-columns:28px 1fr 56px;gap:2px 8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.slot .md{font-size:20px;grid-column:1;grid-row:1/3}.slot .nm{grid-column:2;grid-row:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--ink);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.slot .sc{font-weight:700;text-align:right;padding:1px 4px;border-radius:5px;grid-row:1/3;grid-column:3}
.slot .tr{height:8px;background:var(--line);border-radius:4px;position:relative;grid-column:2;grid-row:2}.slot .tr i{display:block;height:100%;border-radius:4px;background:var(--acc)}.slot .tr u{position:absolute;left:80%;top:-3px;bottom:-3px;border-left:1.5px dashed var(--mut);opacity:.7}
.slot.g .md{filter:none}.slot.out .nm{color:var(--mut)}.slot small{grid-column:2;grid-row:3;color:var(--mut);font-size:11px}
.empty{color:var(--mut);font-size:13px;padding:8px 0;border-top:1px solid var(--line)}
.foot{font-size:11.5px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
.wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
tr.inel td{color:var(--mut)}
.nm-btn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--acc);cursor:pointer;text-align:left;text-decoration:underline dotted;text-underline-offset:3px}
.sim-ban{background:var(--at);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;margin-bottom:12px}
.warn{border-left:4px solid var(--ad);background:var(--adb);color:var(--ink);padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.note{border-left:4px solid var(--c1);background:color-mix(in srgb,var(--c1) 10%,transparent);padding:8px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.stat div{border:1px solid var(--line);border-radius:10px;padding:6px 10px}.stat b{font-size:18px;display:block}.stat span{font-size:11.5px;color:var(--mut)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
#modal.open{display:flex}.mb{background:var(--card);color:var(--ink);border-radius:12px;max-width:980px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.mt{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:12px 12px 0 0;z-index:2}.mt h2{margin:0;font-size:16px}
.mc{padding:12px 16px 18px}
.step{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0}.step .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.step .hd b{font-size:14px}.step .val{margin-left:auto;font-size:18px;font-weight:700}
.step code,.fx{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:color-mix(in srgb,var(--acc) 8%,transparent);padding:1px 6px;border-radius:5px}
.exp{display:none;margin-top:6px;font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}.exp.open{display:block}
.chk{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.params label{display:block;font-size:12.5px;color:var(--mut)}.params input[type=number]{width:100%;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.params .chg input{border-color:var(--at)}
.params small{display:block;font-size:11px}
input[type=search],select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
iframe.orig{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff}
.diffup{color:var(--ok)}.diffdn{color:var(--at)}
#gate{max-width:560px;margin:60px auto}
@media(max-width:600px){nav.main{position:static}main{padding:10px}header img{height:28px}.slot{grid-template-columns:24px 1fr 50px}}
@media print{header,nav.main,.bar{display:none}}
/* demitidos fora do quadro */
.dem{font-size:12px;border-top:1px dashed var(--at);padding-top:6px;color:var(--mut);line-height:1.6}
tr.dem-row td{color:var(--mut);background:color-mix(in srgb,var(--at) 5%,transparent)}
tr.dem-row .nm-btn{color:var(--mut)}
/* radar */
.rleg{display:grid;gap:6px;margin:6px 0;font-size:12.5px;color:var(--mut)}.rleg>div{display:flex;gap:8px;align-items:flex-start}.rleg svg{flex:none;margin-top:3px}
.rtab{width:100%;margin-top:6px;font-size:12.5px}.rtab th{position:static}
/* botões de apoio na ficha */
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.acoes .q{padding:8px 14px;font-weight:600;border:1px solid var(--line);border-radius:10px}
.acoes .fb{background:color-mix(in srgb,var(--c1) 10%,var(--card));color:var(--c1)}.acoes .pdi{background:color-mix(in srgb,var(--c2) 12%,var(--card));color:var(--c2)}
.barra{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
/* documentos de feedback e PDI */
.acao-doc h2{margin:0 0 2px}.acao-doc h3{margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.ed{border-radius:4px;outline:1px dashed color-mix(in srgb,var(--mut) 55%,transparent);outline-offset:2px;padding:0 2px}.ed:hover,.ed:focus{background:color-mix(in srgb,var(--c1) 8%,transparent);outline-color:var(--c1)}
.ed.block{display:block;padding:6px 8px;margin:4px 0;line-height:1.55}
.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.card.warnc{border-left:4px solid var(--c2)}
.two2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.smart{border:1px solid var(--c1);border-radius:12px;padding:10px 12px;margin:10px 0;background:color-mix(in srgb,var(--c1) 6%,var(--card))}
.sm5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}.sm5>div{display:flex;flex-direction:column;gap:2px}.sm5 span{width:26px;height:26px;border-radius:50%;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:700}.sm5 small{color:var(--mut);font-size:12px;line-height:1.35}
.meta{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:14px 0;break-inside:avoid}
.mh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.badge{background:var(--c2);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.smrow{display:flex;gap:10px;align-items:flex-start;margin:6px 0}.smrow .k{flex:none;width:26px;height:26px;border-radius:6px;background:var(--c1);color:#fff;display:grid;place-items:center;font-weight:800;margin-top:2px}.smrow>div{flex:1;min-width:0}
.chkS{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mut)}.chkS label{display:flex;gap:4px;align-items:center}
.rtab.acao td .ed{display:block}
.assin{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
@media print{
  body.print-modal #shell,body.print-modal #gate,body.print-modal header,body.print-modal nav{display:none!important}
  body.print-modal #modal{position:static!important;inset:auto!important;background:#fff!important;overflow:visible!important;display:block!important;height:auto!important}
  body.print-modal #modal .mb{box-shadow:none!important;max-width:none!important;max-height:none!important;border:0!important;overflow:visible!important}
  body.print-modal #modal .mt,body.print-modal .noprint{display:none!important}
  body.print-modal .ed{outline:none!important}
  body.print-modal{background:#fff!important;color:#000!important}
}
.box h2 .chip,.box h3 .chip{white-space:normal;display:inline-block;margin-top:4px;max-width:100%}

/* =====================================================================
   v2 · Redesenho UX (mantém a identidade e a paleta do painel de NPS)
   ===================================================================== */
:root{--bg:#f4f1ea;--card:#fff;--ink:#1b2335;--mut:#5d6a7e;--line:#e3ded1;--acc:#1f3a5f;--acc2:#2b4f7e;--ok:#17744a;--okb:#e1f3e8;--ad:#8a6a06;--adb:#fbf0cc;--at:#b42318;--atb:#fde6e2;--c1:#2f6db5;--c2:#c9731a;--c3:#7a4fb0;--c4:#c2456f;--c5:#1a7f6e;--gold:#d4a017;--goldb:#fdf3d0;--silver:#7d8797;--bronze:#b26a2e;--sh:0 1px 2px rgba(31,58,95,.06),0 6px 18px rgba(31,58,95,.07);--r:16px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141c;--card:#18202b;--ink:#e9edf3;--mut:#9aa6b8;--line:#2a3443;--acc:#a9c4ea;--acc2:#1f3a5f;--ok:#5fd09a;--okb:#14301f;--ad:#e6c65e;--adb:#33290d;--at:#ff8f82;--atb:#3b1b18;--c1:#6ea6ee;--c2:#f0a24d;--c3:#b794e8;--c4:#f07aa0;--c5:#4fd0b8;--gold:#f0c24b;--goldb:#33290d;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme=dark]{--bg:#0f141c;--card:#18202b;--ink:#e9edf3;--mut:#9aa6b8;--line:#2a3443;--acc:#a9c4ea;--acc2:#1f3a5f;--ok:#5fd09a;--okb:#14301f;--ad:#e6c65e;--adb:#33290d;--at:#ff8f82;--atb:#3b1b18;--c1:#6ea6ee;--c2:#f0a24d;--c3:#b794e8;--c4:#f07aa0;--c5:#4fd0b8;--gold:#f0c24b;--goldb:#33290d;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
body{font:15px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.01em}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;stroke:currentColor}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid color-mix(in srgb,var(--c1) 55%,transparent);outline-offset:2px}
button,.btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;font-weight:600;transition:background .15s,border-color .15s,transform .05s}
button:active{transform:translateY(1px)}

/* cabeçalho */
header{background:linear-gradient(120deg,#16294a 0%,#1f3a5f 55%,#2b4f7e 100%);border-bottom:0;padding:10px 20px;color:#fff;box-shadow:0 2px 12px rgba(15,30,60,.25);position:sticky;top:0;z-index:20}
header .hb{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{height:38px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 10px;border-radius:12px}
.ht{display:flex;flex-direction:column;line-height:1.15}.ht h1{font-size:18px;color:#fff;margin:0;font-weight:800}.ht span{font-size:12px;color:#c9d8ee}
header .tag{background:#ffc93c;color:#2a2200;font-size:12px;padding:3px 12px;font-weight:800;border-radius:99px}
.hbtn{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.3)!important;color:#fff!important;padding:7px 12px}
.hbtn:hover{background:rgba(255,255,255,.22)!important}

/* navegação */
nav.main{top:60px;z-index:15;padding:0 16px;gap:2px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(31,58,95,.05)}
nav.main button{border:0;border-radius:0;background:none;padding:13px 14px;color:var(--mut);border-bottom:3px solid transparent;font-weight:700}
nav.main button:hover{color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,transparent)}
nav.main button.on{background:none;color:var(--acc);border-bottom-color:var(--gold)}
nav.main button.on .ic{color:var(--gold)}
main{max-width:1280px;padding:22px 20px 40px}

/* títulos de tela */
.vt{display:flex;gap:14px;align-items:center;margin:26px 0 14px}
.vti{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--c1) 14%,var(--card));color:var(--c1);display:grid;place-items:center;flex:none}.vti .ic{width:24px;height:24px}
.vt h2{font-size:21px;margin:0;color:var(--acc)}.vt p{margin:2px 0 0;color:var(--mut);font-size:13.5px}

/* hero + KPIs */
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:20px 22px;margin-bottom:8px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--gold),var(--c2))}
.hero-t{display:flex;gap:14px;align-items:flex-start}
.hero-i{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#ffd666,#e8a317);color:#3a2a00;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px rgba(212,160,23,.35)}.hero-i .ic{width:28px;height:28px}
.hero h2{margin:0 0 4px;font-size:22px;color:var(--acc)}.hero p{margin:0;color:var(--mut);font-size:14px;max-width:900px}.hero p b{color:var(--ink)}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0 4px}
.kpis .kp{display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kp .ki{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}.kp .ki .ic{width:22px;height:22px}
.kp b{font-size:26px;line-height:1;display:block;color:var(--ink)}.kp span{font-size:12.5px;color:var(--mut)}.kp small{display:block;font-size:11.5px;color:var(--mut);opacity:.9}
.kp.t-blue .ki{background:color-mix(in srgb,var(--c1) 16%,var(--card));color:var(--c1)}
.kp.t-green .ki{background:var(--okb);color:var(--ok)}
.kp.t-gold .ki{background:var(--goldb);color:var(--gold)}
.kp.t-red .ki{background:var(--atb);color:var(--at)}
.kpis div.kp b{display:block;font-size:26px}

/* regra de desligados */
.swr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid}
.swr.on{background:color-mix(in srgb,var(--c1) 8%,var(--card));border-color:color-mix(in srgb,var(--c1) 30%,var(--line))}
.swr.off{background:var(--adb);border-color:color-mix(in srgb,var(--ad) 40%,var(--line))}
.swi{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--c1);flex:none}.swr.off .swi{color:var(--ad)}
.swt{flex:1;min-width:240px;font-size:13px;color:var(--mut)}.swt b{display:block;color:var(--ink);font-size:14px}

/* destaques */
.hl4{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:18px}
.hl{background:linear-gradient(160deg,var(--goldb),var(--card) 70%);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
.hl-h{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--acc);flex-wrap:wrap}.hl-h em{font-style:normal;font-weight:600;font-size:12px;color:var(--mut);margin-left:auto;display:flex;align-items:center;gap:4px}
.hl-b{display:flex;gap:10px;align-items:center;margin-top:10px}
.hl-b .nm-btn{flex:1;font-size:15px;font-weight:800;text-decoration:none;color:var(--ink)}.hl-b .nm-btn:hover{text-decoration:underline}
.hl .foot{margin-top:6px;display:flex;gap:4px;align-items:center}

/* seção de grupo */
.box{border-radius:var(--r);box-shadow:var(--sh)}
.box.grp{padding:18px 18px 8px;margin-bottom:20px}

    ex:["Em Excelência (≥ "+P.fx_exc+")",el.filter(c=>c.fx==="Excelência"),"Índice igual ou acima de "+P.fx_exc],
    cons:["Consolidado ("+P.fx_cons+" a "+fmt(P.fx_exc-0.1)+")",el.filter(c=>c.fx==="Consolidado"),"Índice entre "+P.fx_cons+" e "+fmt(P.fx_exc-0.1)],
    dev:["Em desenvolvimento (< "+P.fx_cons+")",el.filter(c=>c.fx==="Em desenvolvimento"),"Índice abaixo de "+P.fx_cons],
    sem:["Sem faixa (poucos avaliadores)",VL.filter(c=>!c.elig),"Menos de "+P.min_aval+" avaliadores: o resultado não é divulgado"]}[k];
  const l=M[1].slice().sort(ord);
  const rows=l.length?l.map(c=>{const pp=c.resp/c.atrib;return `<tr class="${c.sit==="Desligado(a)"?"dem-row":""}"><td><button class="nm-btn" data-act="ficha" data-k="${esc(c.key)}">${esc(c.nome)}</button> ${sitChip(c)}</td><td>${ic(FNIC[c.papel])} ${c.papel}</td><td>${esc(c.atua)}</td><td class="n">${c.elig?`<span class="pill ${scls(c.idx)}">${fmt(c.idx)}</span>`:'<span class="na">–</span>'}</td><td>${c.elig?`<span class="chip ${fcls(c.fx)}">${ic(fic(c.fx))}${c.fx}</span>`:'<span class="chip">Sem faixa</span>'}</td><td class="n">${c.resp} de ${c.atrib} (${pct(pp)})</td></tr>`}).join(""):`<tr><td colspan="6" class="na">Nenhum coordenador nesta situação.</td></tr>`;
  return `<div class="kl" id="kpilist"><div class="kl-h"><div><h3>${esc(M[0])}</h3><p>${l.length} coordenador(es) · ${M[2]}</p></div><button class="q" data-act="kpi" data-k="${k}">${ic("x")} Fechar lista</button></div><div class="wrap"><table><thead><tr><th>Coordenador(a)</th><th>Função</th><th>Atua em</th><th class="n">Índice</th><th>Faixa</th><th class="n">Preenchimento</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function vVies(){
  const V=D.viesStats, mx=Math.max(...V.hist);
  const bars=V.hist.map((n,i)=>{const lo=V.histIni+i*5;return `<div class="${lo<-5?"neg":(lo>=5?"pos":"")}" style="height:${n/mx*100}%" title="${lo} a ${lo+5}: ${n} avaliador(es)"><span>${n||""}</span></div>`}).join("");
  const lab=V.hist.map((n,i)=>`<div>${V.histIni+i*5}</div>`).join("");
  let h=vtitle("sliders","Viés de compensação","Proposta para corrigir avaliadores mais rígidos ou mais generosos que os colegas.");
  h+=`<div class="box"><p style="margin-top:0">Alguns docentes avaliam sempre mais alto ou mais baixo que os colegas que avaliaram o mesmo coordenador. A proposta repete a lógica usada com os docentes (índice − viés), mas compara cada resposta com a dos colegas <b>na mesma pergunta e no mesmo coordenador</b>.</p>
  <div class="kpis"><div class="kp t-blue"><span class="ki">${ic("users")}</span><div><b>${V.avaliadores}</b><span>avaliadores</span></div></div><div class="kp t-gold"><span class="ki">${ic("trend")}</span><div><b>${V.rig10}</b><span>bem mais rígidos (viés ≤ −10)</span></div></div><div class="kp t-green"><span class="ki">${ic("smile")}</span><div><b>${V.ger10}</b><span>bem mais generosos (viés ≥ +10)</span></div></div><div class="kp t-red"><span class="ki">${ic("star")}</span><div><b>${V.tudo100}</b><span>marcaram tudo “Sempre”</span></div></div><div class="kp t-blue"><span class="ki">${ic("search")}</span><div><b>${V.pairsDiv}</b><span>de ${V.pairsAvaliados} avaliações com diferença ≥ ${P.lim_div} pts</span></div></div></div>
  <h3>Viés por avaliador (pontos)</h3><div class="hist">${bars}</div><div class="hlab">${lab}</div><div class="foot">Esquerda: mais rígidos · direita: mais generosos. Os avaliadores aparecem apenas por código.</div></div>`;
  h+=swc();
  const l=VIS().filter(c=>c.elig);
  h+=`<div class="box"><h2>${ic("chart")} Antes e depois da compensação</h2><div class="wrap"><table><thead><tr><th>Coordenador(a)</th><th>Função</th><th class="n">Índice bruto</th><th class="n">Viés</th><th class="n">Compensado</th><th>Faixa antes</th><th>Faixa depois</th><th class="n">Dispersão entre avaliadores</th></tr></thead><tbody>`;
  l.sort((a,b)=>FN.indexOf(a.papel)-FN.indexOf(b.papel)||b.adj-a.adj).forEach(c=>{const fa=faixa(c.bruto),fd=faixa(c.adj),ch=fa!==fd;h+=`<tr class="${c.sit==="Desligado(a)"?"dem-row":""}"><td><button class="nm-btn" data-act="ficha" data-k="${esc(c.key)}">${esc(c.nome)}</button></td><td>${c.papel}</td><td class="n">${fmt(c.bruto)}</td><td class="n">${c.vies>=0?"+":""}${fmt(c.vies)}</td><td class="n"><b>${fmt(c.adj)}</b></td><td><span class="chip ${fcls(fa)}">${fa}</span></td><td><span class="chip ${fcls(fd)}">${fd}</span>${ch?' <span class="chip at">mudou</span>':""}</td><td class="n">${fmt(c.dp)}</td></tr>`;});
  const mud=l.filter(c=>faixa(c.bruto)!==faixa(c.adj)).length;
  h+=`</tbody></table></div><div class="foot">${mud} coordenador(es) mudam de faixa com a compensação. Dispersão = desvio-padrão das médias dadas pelos avaliadores a cada coordenador (quanto maior, mais as opiniões divergem).</div></div>`;
  const dtab=(rows,cls)=>`<div class="wrap"><table><thead><tr><th>Avaliador</th><th>Coordenador(a)</th><th class="n">Dele</th><th class="n">Demais</th><th class="n">Dif.</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.code}</td><td>${esc(x.ad)}</td><td class="n">${fmt(x.media)}</td><td class="n">${fmt(x.outros)}</td><td class="n ${cls}">${x.dif>0?"+":""}${fmt(x.dif)}</td></tr>`).join("")}</tbody></table></div>`;
  h+=`<div class="box"><h2>${ic("search")} Avaliações muito diferentes dos colegas</h2><p class="foot">Docentes cuja média para um coordenador ficou ${P.lim_div} pontos ou mais afastada da média dos demais avaliadores do mesmo coordenador (${D.div.length} casos listados; mostrando os 25 maiores em cada sentido; casos de coordenadores desligados ficam fora da lista).</p><div class="two"><div><h3>Bem mais rígidos que os colegas</h3>${dtab(D.div.filter(x=>x.dif<0).slice(0,25),"at")}</div><div><h3>Bem mais generosos que os colegas</h3>${dtab(D.div.filter(x=>x.dif>0).slice(-25).reverse(),"ad")}</div></div></div>`;
  h+=`<div class="box"><h2>${ic("calc")} Como a compensação é calculada</h2><ol><li>Para cada resposta, compara a nota do avaliador com a média dos colegas na mesma pergunta e no mesmo coordenador (sem contar a dele). Só entra se a pergunta teve ${P.min_comp} avaliadores ou mais.</li><li><b>Viés do avaliador</b> = média dessas diferenças. Positivo = generoso; negativo = rígido.</li><li><b>Viés do coordenador</b> = média do viés dos avaliadores nas respostas que ele recebeu (ponderada pelo número de respostas de cada um).</li><li><b>Índice compensado</b> = índice bruto − viés (limitado a 0–100). Igual ao “C ajustado” dos docentes.</li></ol><div class="note">${ic("info")}<div>Por que não usar a média geral, como nos docentes? Porque um avaliador que só avaliou coordenadores muito bons pareceria “generoso” sem ser. Comparar com os colegas do mesmo coordenador evita essa confusão.</div></div></div>`;
  return h;
}

  <div class="box"><h2>${ic("calc")} Como chegamos ao resultado</h2><ol><li><b>Notas:</b> Sempre = 100 · Quase sempre = 75 · Às vezes = 50 · Raramente = 25 · Nunca = 0. “Não aplicável” fica de fora.</li><li><b>Respostas repetidas</b> (mesmo docente, coordenador e pergunta) contam uma vez, a última.</li><li><b>Índice bruto</b> = média simples de todas as respostas recebidas.</li><li><b>Compensação de viés</b> (opcional, proposta): índice bruto − viés dos avaliadores.</li><li><b>Elegível:</b> pelo menos ${P.min_aval} docentes diferentes avaliaram.</li><li><b>Faixa:</b> Excelência ≥ ${P.fx_exc} · Consolidado ${P.fx_cons} a ${fmt(P.fx_exc-0.1)} · Em desenvolvimento &lt; ${P.fx_cons}. Sem pódio e sem ranking.</li><li><b>Categorias:</b> mesma conta, só com as perguntas de cada categoria, separadas por função.</li></ol></div>
  <div class="box"><h2>${ic("list")} Categorias e perguntas por função</h2>${FN.map(f=>`<details><summary>${f} · ${D.cats[f].length} categorias · ${D.cats[f].reduce((a,k)=>a+k.perguntas.length,0)} perguntas</summary>${D.cats[f].map(k=>`<details style="margin-left:14px"><summary>${esc(k.nome)} (${k.perguntas.length})</summary><ul>${k.perguntas.map(x=>`<li>${esc(x.perg)}</li>`).join("")}</ul></details>`).join("")}</details>`).join("")}</div>`;
}
function step(t,f,calc,v,exp){return `<div class="step"><div class="hd"><b>${t}</b><code>${f}</code><span class="val">${v}</span></div><div class="foot">${calc}</div><div class="exp open">${exp}</div></div>`;}
function ficha(k){
  const c=D.coords.find(x=>x.key===k), pp=c.resp/c.atrib;
  let h=`<div class="mh"><span class="chip">${ic(FNIC[c.papel])}${c.papel}</span>${c.elig?`<span class="chip ${fcls(c.fx)}">${ic(fic(c.fx))}${c.fx}</span>`:'<span class="chip">Sem faixa</span>'}${sitChip(c)}</div><div class="foot">${esc(c.atua)}</div>`;
  if(c.sit==="Desligado(a)")h+=`<div class="warn">${ic("warn")}<div>Desligado(a): fora de destaques; a nota fica nas médias da função.${k==="ANNE CAROLINE BRAGA NEROSKY"?" As respostas são posteriores à data de desligamento; vale confirmar se os docentes avaliaram a pessoa ou quem ocupa a função hoje.":""}</div></div>`;
  h+=step("1. Respostas válidas","n respostas",`${c.nResp} respostas de ${c.nAval} docentes`,c.nResp,"“Não aplicável” e respostas repetidas já ficaram de fora.");
  h+=step("2. Índice bruto","soma das notas ÷ respostas",`${Math.round(c.soma)} ÷ ${c.nResp}`,fmt(c.bruto,2),"Todas as perguntas e avaliadores com o mesmo peso.");
  h+=step("3. Viés ponderado","Σ(n × viés do avaliador) ÷ n",`${c.raters.length} avaliadores`,(c.vies>=0?"+":"")+fmt(c.vies,2),"Positivo: os avaliadores dele foram mais generosos que os colegas; negativo: mais rígidos.");
  h+=step("4. Índice compensado","limita(bruto − ajuste × viés; 0..100)",`${fmt(c.bruto,2)} − ${S.aj} × ${fmt(c.vies,2)}`,fmt(c.adj,2),S.aj?"Compensação ligada.":"Compensação desligada nesta visão: o índice usado é o bruto.");
  h+=step("5. Elegibilidade e faixa",`avaliadores ≥ ${P.min_aval}`,`${c.nAval} avaliadores`,c.elig?c.fx:"Sem faixa",c.elig?`Índice ${fmt(c.idx)} → ${c.fx}. Média da função: ${fmt(D.fm[c.papel])}.`:"Poucos avaliadores para divulgar faixa.");
  h+=step("6. Preenchimento","responderam ÷ deveriam responder",`${c.resp} de ${c.atrib}${c.est?" (total estimado)":""}`,pct(pp),"Quantos docentes preencheram a avaliação deste coordenador.");
  if(c.elig){h+=`<h3>Categorias de ${c.papel}</h3><div class="wrap"><table><thead><tr><th>Categoria</th><th class="n">Respostas</th><th class="n">Bruta</th><th class="n">Compensada</th><th class="n">Média da função</th><th class="n">Diferença</th></tr></thead><tbody>${c.catv.map(x=>`<tr><td>${esc(catName(c.papel,x.c))}</td><td class="n">${x.n}</td><td class="n">${fmt(x.bruto)}</td><td class="n"><b>${fmt(x.v)}</b></td><td class="n">${fmt(D.cm[x.c])}</td><td class="n ${x.v-D.cm[x.c]>=0?"diffup":"diffdn"}">${x.v-D.cm[x.c]>=0?"+":""}${fmt(x.v-D.cm[x.c])}</td></tr>`).join("")}</tbody></table></div>`;}
  h+=`<details><summary>Avaliadores e viés (${c.raters.length})</summary><div class="wrap"><table><thead><tr><th>Avaliador</th><th class="n">Respostas</th><th class="n">Média dele</th><th class="n">Média dos demais</th><th class="n">Diferença</th><th class="n">Viés do avaliador</th></tr></thead><tbody>${c.raters.map(r=>`<tr><td>${r.code}</td><td class="n">${r.n}</td><td class="n">${fmt(r.media)}</td><td class="n">${fmt(r.outros)}</td><td class="n">${r.dif==null?"–":(r.dif>=0?"+":"")+fmt(r.dif)}</td><td class="n">${r.vies>=0?"+":""}${fmt(r.vies)}</td></tr>`).join("")}</tbody></table></div></details>`;
  h+=`<details><summary>Perguntas (${c.qs.length}) · médias brutas</summary><div class="wrap"><table><thead><tr><th>Categoria</th><th>Pergunta</th><th class="n">Resp.</th><th class="n">Média</th></tr></thead><tbody>${c.qs.map(x=>`<tr><td>${esc(catName(c.papel,x.c))}</td><td>${esc(x.p)}</td><td class="n">${x.n}</td><td class="n">${fmt(x.m)}</td></tr>`).join("")}</tbody></table></div></details>`;
  openM(esc(c.nome),h);
}

function closeM(){const m=$("#modal");m.classList.remove("open");m.innerHTML="";document.body.style.overflow="";}
const isDark=()=>{const r=document.documentElement;return r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);};
function themeBtn(){const d=isDark();$(".hbtn").innerHTML=ic(d?"sun":"moon")+"<span>"+(d?"Claro":"Escuro")+"</span>";}
function render(){calc();$("nav.main").innerHTML=TABS.map(t=>`<button data-act="tab" data-v="${t[0]}" class="${t[0]===S.tab?"on":""}">${ic(t[1])}<span>${t[2]}</span></button>`).join("");
  $("#app").innerHTML=({geral:vGeral,cat:vCat,preench:vPre,vies:vVies,metodo:vMet})[S.tab]();themeBtn();}
function go(v){S.tab=v;S.kpi=null;try{history.replaceState(null,"","#/"+v);}catch(e){}render();window.scrollTo(0,0);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b){if(e.target.id==="modal")closeM();return;}
  const a=b.dataset.act,v=b.dataset.v;
  if(a==="tab")go(v);else if(a==="aj"){S.aj=+v;render();}else if(a==="fn"){S.fn=v;render();}
  else if(a==="kpi"){S.kpi=S.kpi===b.dataset.k?null:b.dataset.k;render();if(S.kpi){const el=$("#kpilist");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}}
  else if(a==="ficha")ficha(b.dataset.k);else if(a==="close")closeM();
  else if(a==="theme"){const r=document.documentElement,d=isDark();r.dataset.theme=d?"light":"dark";try{localStorage.setItem("th",r.dataset.theme);}catch(x){}themeBtn();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM();});
window.addEventListener("hashchange",()=>{const v=(location.hash.match(/#\/(\w+)/)||[])[1];if(v&&v!==S.tab&&TABS.some(t=>t[0]===v)){S.tab=v;S.kpi=null;render();window.scrollTo(0,0);}});
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t;}catch(e){}
try{const lg=window.LOGO;if(lg){$("#logo").src=lg;document.documentElement.style.setProperty("--logo",'url("'+lg+'")');}}catch(e){}
{const v=(location.hash.match(/#\/(\w+)/)||[])[1];if(TABS.some(t=>t[0]===v))S.tab=v;}
render();
window.CoordApp={state:S,ficha};
})();
</script>
</body></html>
