const need=t=>t.need;
function alerts(t){const a=[];const ok=(l)=>l.length>0;
 if(t.need>=1&&!ok(t.en))a.push('Sem regente de Inglês');if(t.need==2&&!ok(t.pt))a.push('Sem regente de Português');
 if(['Kinder 2','Kinder 3','Kinder 4','Kinder 5','1º Ano','2º Ano','3º Ano'].includes(t.serie)&&!t.aux.length)a.push('Sem auxiliar de classe');
 if([...t.en,...t.pt].some(x=>x[1]))a.push('Regente afastado');if(t.aux.some(x=>x[1]))a.push('Auxiliar afastado');if(t.al>t.cap)a.push('Acima da capacidade');return a}
function card(t){const al=alerts(t);const p=t.al/t.cap*100;
 const reg=(lab,cls,l,req)=>`<div class="sec ${cls}"><h3>${lab}</h3><div>${l.length?nm(l):(req?'<span class="vago">VAGO</span>':'<span class="none">—</span>')}</div></div>`;
 let h=`<div class="card"><div class="ch"><h2>${e(t.t)}</h2><small>${e(t.turno)} · ${t.al}/${t.cap} alunos</small></div><div class="occ"><i class="${p>=96?'h':p>=80?'m':''}" style="width:${Math.min(p,100)}%"></i></div>`;
 if(t.need==1)h+=reg('Regente (Inglês)','en',t.en,1);
 if(t.need==2){h+=reg('Regente Inglês','en',t.en,1)+reg('Regente Português','pt',t.pt,1)}
 h+=`<div class="sec esp"><h3>${t.need?'Especialistas':'Professores por componente'}</h3>${t.esp.map(([d,l])=>`<div><span class="d">${e(d)}:</span> ${nm(l)}</div>`).join('')||'<span class="none">—</span>'}</div>`;
 if(t.sg!='EF2'&&t.sg!='EM'){h+=`<div class="sec aux"><h3>Auxiliar de classe</h3><div>${t.aux.length?nm(t.aux):'<span class="none">—</span>'}</div></div><div class="sec vol"><h3>Auxiliar volante</h3><div>${t.vol.length?t.vol.map(e).join('<br>'):'<span class="none">—</span>'}</div></div>`}

let SEG='';

function render(){const q=document.getElementById('q').value.toLowerCase(),s=document.getElementById('s').value,f=document.getElementById('f').value;

const SEGS=['',...[...new Set(D.map(t=>t.seg))]];
