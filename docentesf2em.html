<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}.kpis div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}.kpis b{font-size:22px;display:block}.kpis span{font-size:12px;color:var(--mut)}

.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}.chip.ad{background:var(--adb);color:var(--ad);border-color:transparent}.chip.at{background:var(--atb);color:var(--at);border-color:transparent}

.mt{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:12px 12px 0 0;z-index:2}.mt h2{margin:0;font-size:16px}
.mc{padding:12px 16px 18px}

.exp{display:none;margin-top:6px;font-size:13px;color:var(--mut);border-top:1px dashed var(--line);padding-top:6px}.exp.open{display:block}
.chk{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}

.card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}.card.warnc{border-left:4px solid var(--c2)}

.chkS{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:var(--mut)}.chkS label{display:flex;gap:4px;align-items:center}

}

:root{--d1:#2f6db5;--d2:#1f7a4d;--d3:#7a4fb0;--d4:#c9731a;--d5:#0e8c8c;--sh:0 1px 2px rgba(20,30,50,.06),0 6px 18px rgba(20,30,50,.06)}

.phead{position:sticky;top:0;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:12px}
.phead h2{margin:0;font-size:19px}.phead .meta2{color:var(--mut);font-size:12.5px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:0}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;background:var(--card);color:var(--ink)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme=dark] .tabs button.on{color:#12161d}
.box{border-radius:16px;box-shadow:var(--sh)}
.box h2{font-size:16px;display:flex;align-items:center;gap:8px}
.kpi2>div{border-radius:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi2 .v{display:flex;align-items:center;gap:12px}
.gauge{display:flex;align-items:center;gap:14px}
.dimrow{display:grid;grid-template-columns:190px 1fr;gap:10px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dimrow:first-child{border-top:0}
.dimrow .dn{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13.5px}.dimrow .dn small{display:block;font-weight:400;color:var(--mut);font-size:11px}
.dimrow .dn .bub{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none}
.bl .t{height:10px}
.radwrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:18px;align-items:center}
@media(max-width:820px){.radwrap{grid-template-columns:1fr}.dimrow{grid-template-columns:1fr}}
.heat td.hc{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.hc.at{background:var(--atb)}.hc.ad{background:var(--adb)}.hc.ok{background:var(--okb)}
.insight{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;margin:6px 0;font-size:13px}
.insight.ok{background:var(--okb)}.insight.at{background:var(--adb)}.insight.dv{background:color-mix(in srgb,var(--c3) 9%,var(--card))}
.insight .ii{font-size:17px;line-height:1.2}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:820px){.cols2{grid-template-columns:1fr}}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
.srcgrid div{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px}
.srcgrid b{display:block;font-size:12.5px}.srcgrid .pill{margin-top:4px}
.vcomp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.vcomp div{border-radius:12px;background:color-mix(in srgb,var(--c3) 9%,var(--card));padding:8px 10px;font-size:12px}.vcomp b{display:block;font-size:17px}
.foot a,.footlink{color:var(--acc);cursor:pointer;text-decoration:underline}
.sctr,.radsvg{max-width:100%}
.print-hide{}
@media print{header{display:none}.phead{position:static;box-shadow:none}}
.pcard h3{color:var(--ink)}.pc-top h3 span{color:inherit}
.c-f i{background:var(--d2)}.lg .cf:before{background:var(--d2)}
.bl .rd{font-size:11.5px;color:var(--mut);margin-top:3px}
</style></head><body>

const EXI={'E1':['🧭','--d4'],'E2':['🗣️','--d5'],'E3':['🤝','--d2'],'E4':['💡','--d1'],'E5':['🧩','--d3'],'E6':['👨‍👩‍👧','--gold']};

function eixoRows(c){
  const p=c.p;

    const al=e.startsWith('E1')?p.tut.m:e.startsWith('E2')?p.idi.m:null,fa=e.startsWith('E1')?p.fam.m:null;
    const nal=e.startsWith('E1')?p.tut.resp:e.startsWith('E2')?p.idi.resp:0,nfa=e.startsWith('E1')?p.fam.n:0;
    const vs=[x.C,x.A,al].filter(num);let rd='';
    if(num(x.C)&&num(x.A)){const d=x.A-x.C;rd=Math.abs(d)>10?(d>0?'Autoavaliação '+fmt(d)+' pts acima da coordenação':'Autoavaliação '+fmt(-d)+' pts abaixo da coordenação'):'Coordenação e autoavaliação convergem'}

    if(vs.length>=2&&Math.min(...vs)>=85&&Math.max(...vs)-Math.min(...vs)<=8)rd='Convergência em nível alto — fortaleza consolidada';
    return {e,k:exk(e),nome:e.replace(/^E\d — /,''),C:x.C,nC:x.nC,A:x.A,nA:x.nA,al,nal,fa,nfa,gC:EG[p.seg][e].C,gA:EG[p.seg][e].A,rd};
  }).filter(Boolean);
}
function radarEixos(rows){
  const ds=rows.filter(r=>num(r.C)||num(r.A));if(ds.length<3)return '';
  const W=400,H=330,cx=W/2,cy=H/2+4,R=108,n=ds.length,MIN=40;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=R*Math.max(0,Math.min(100,v)-MIN)/(100-MIN);return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let s='<svg class="radsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Radar por eixo comum">';
  [40,55,70,85,100].forEach(v=>{s+='<polygon points="'+ds.map((_,i)=>pt(i,v).join(',')).join(' ')+'" fill="none" stroke="var(--line)" stroke-width="1"/>'});
  ds.forEach((r,i)=>{const [px,py]=pt(i,100),[lx,ly]=pt(i,120);const lab=r.nome.split(' e ')[0].split(',')[0];s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+px+'" y2="'+py+'" stroke="var(--line)"/><text x="'+lx+'" y="'+(ly+5)+'" text-anchor="'+(lx<cx-8?'end':lx>cx+8?'start':'middle')+'" font-size="12" fill="var(--ink)">'+EXI[r.k][0]+' '+esc(lab.length>16?lab.slice(0,15)+'…':lab)+'</text>'});
  const poly=(key,col,dash,fill)=>{const pts=ds.map((r,i)=>pt(i,num(r[key])?r[key]:MIN).join(',')).join(' ');return '<polygon points="'+pts+'" fill="'+(fill?col:'none')+'" fill-opacity=".14" stroke="'+col+'" stroke-width="2.2"'+(dash?' stroke-dasharray="5 4"':'')+'/>'};
  s+=poly('gC','var(--mut)',true,false)+poly('C','var(--c1)',false,true)+poly('A','var(--c2)',false,true);
  ds.forEach((r,i)=>{[['C','var(--c1)'],['A','var(--c2)']].forEach(([k,col])=>{if(num(r[k])){const [px,py]=pt(i,r[k]);s+='<circle cx="'+px+'" cy="'+py+'" r="4.5" fill="'+col+'" stroke="var(--card)" stroke-width="2"><title>'+esc(r.nome)+' · '+(k==='C'?'coordenação':'autoavaliação')+': '+fmt(r[k])+'</title></circle>'}})});
  return s+'</svg><div class="lg" style="justify-content:center"><span class="c1">Coordenação (bruta)</span><span class="c2">Autoavaliação</span><span><i style="display:inline-block;width:14px;border-top:2px dashed var(--mut);vertical-align:3px;margin-right:4px"></i>Média da coordenação no segmento</span></div><p class="foot" style="text-align:center">Centro = 40 · borda = 100.</p>';
}

  let h='<div class="bar"><button data-act="back">← Voltar aos professores</button></div><div class="note"><b>Síntese metodológica para homologação.</b> Esta página responde ao item 21.11: o que foi preservado, o que foi adaptado, as regras usadas, o que depende de decisão institucional e as limitações. Tudo o que não foi homologado está marcado como <i>provisório</i>.</div>';
  h+='<div class="box"><h2>1. O que foi preservado do Kinder e do Fundamental I</h2><ul><li><b>Escala 0–100</b> (Sempre 100 · Quase sempre/Frequentemente 75 · Às vezes 50 · Raramente 25 · Nunca 0); “Não sei avaliar/Sem base” fora da média; resposta ausente nunca vira zero. Idioma (0–4) convertido para 0–100.</li><li><b>Viés da coordenação</b> por avaliadora (média dela − média geral) e <b>coordenação ajustada</b> = bruta − viés, com nota bruta, viés e ajustada sempre visíveis.</li><li><b>Fórmula do Índice Final</b>: Base = 50% coordenação ajustada + 50% voz externa; Perda 1 = 0,5 × (|coord. ajustada − voz externa| − 10, mínimo 0); Perda 2 = 0,5 × (|autoavaliação − Base| − 10, mínimo 0); Índice = Base − perdas. A autoavaliação <b>não soma pontos</b>: só pode reduzir o índice quando destoa da Base.</li><li><b>Elegibilidade</b>: ≥ 2 avaliadoras, autoavaliação presente e ≥ 5 respondentes externos; professores desligados/afastados saem do quadro, mas suas notas seguem nas médias do segmento.</li><li><b>Semáforo</b> (vermelho &lt; 85, amarelo 85–89,9, verde ≥ 90), identidade visual, roteiro de feedback, relatório do professor e PDI SMART (estrutura S-M-A-R-T, metas com ações, frequência, evidência, apoio e prazos de 30/60/90 dias).</li></ul></div>';
  h+='<div class="box"><h2>2. Adaptações necessárias ao Fund. II e Ensino Médio</h2><ul><li><b>Dimensões = blocos oficiais dos questionários</b>: Prática Pedagógica ('+cnt(qc,'PRÁTICA PEDAGÓGICA')+' perguntas da coordenação), Formação Integral ('+cnt(qc,'FORMAÇÃO INTEGRAL')+'), Psicologia / Socioemocional ('+cnt(qc,'PSICOLOGIA / SOCIOEMOCIONAL')+'); somadas a Tutoria ('+cnt(qc,'TUTORIA')+') e Idioma ('+cnt(qc,'IDIOMA')+'), que são blocos próprios dos instrumentos de alunos/famílias e itens da coordenação identificados por texto (“Como tutor(a)…” e “exclusivamente o idioma…”).</li><li><b>Dupla vinculação</b>: as perguntas de tutoria e de idioma pertencem ao bloco de origem na coordenação (Formação Integral/Prática Pedagógica) <i>e</i> à dimensão Tutoria/Idioma. Regra anti dupla contagem: cada pergunta entra uma única vez no cálculo, na dimensão mais específica (Tutoria/Idioma); o bloco de origem é calculado sem elas. O IDP geral usa todas as respostas da coordenação uma vez só.</li><li><b>Voz externa</b>: no Kinder/Fund. I era a família sobre o professor. Aqui, pelo desenho da pesquisa, há nota externa para <b>Tutoria</b> (alunos: 5 perguntas; famílias: 1 pergunta, atribuída ao tutor) <b>Idioma</b> (alunos, escala 0–4) e <b>Citações</b> (alunos, todos os professores com ≥ 10 respondentes). As demais perguntas de famílias falam da escola e <b>não</b> entram.</li><li><b>Citações dos alunos</b> (blocos 1 a 3) são só positivas. Viram um percentil entre professores ativos do segmento e entram na voz externa como <b>nota de citação = 70 + 0,3 × percentil</b> (elegível com ≥ 10 alunos respondentes). Não geram nota por dimensão. O painel de reconhecimento (IRD) foi retirado deste HTML e será feito à parte; o cálculo segue na planilha de referência.</li><li><b>Comentários abertos</b>: viram síntese qualitativa (temas), sem nota e sem penalização.</li></ul></div>';
  h+='<div class="box"><h2>3. Regras de cálculo usadas</h2><table class="rtab"><tbody><tr><td>Coordenação bruta (C)</td><td>média das respostas válidas de todas as avaliadoras, por professor (cada pergunta uma vez por avaliadora)</td></tr><tr><td>Coordenação ajustada</td><td>C − viés médio das avaliadoras (ponderado pelo nº de respostas de cada uma), limitada a 0–100</td></tr><tr><td>Voz externa (V)</td><td>média das fontes externas elegíveis (Tutoria, Idioma e Citações). Em Tutoria: média simples entre alunos e famílias quando ambos existem. Tutoria e Idioma exigem ≥ 5 respondentes (alunos distintos + famílias; em Idioma, alunos); Citações exigem ≥ 10 alunos respondentes</td></tr><tr><td>IDP completo</td><td>Base − Perda 1 − Perda 2, com Base = 0,5·C ajustada + 0,5·V (professores com V elegível)</td></tr><tr><td>IDP parcial</td><td>C ajustada, sem V. Rotulado como parcial; <b>não</b> entra em comparação direta com o completo (nenhum caso no ciclo atual, pois as citações cobrem quase todos)</td></tr><tr><td>Dados insuficientes</td><td>&lt; 2 avaliadoras ou sem autoavaliação, ou desligado/afastado</td></tr><tr><td>Nota da dimensão</td><td>0,5·C ajustada da dimensão + 0,5·V da dimensão (se V elegível); senão C ajustada</td></tr><tr><td>Nota de citação</td><td>taxa = citações recebidas ÷ (alunos respondentes do professor × 10 perguntas); percentil entre professores ativos do segmento com ≥ 10 respondentes; nota = 70 + 0,3 × percentil</td></tr><tr><td>Tamanho de amostra</td><td>Alta: coordenação ≥ 3 avaliadoras e ≥ 40 respostas; alunos/famílias ≥ 10 (tutoria/idioma) ou ≥ 20 (citações). Abaixo disso, o indicador aparece com aviso ou “dados insuficientes”</td></tr></tbody></table></div>';
  h+='<div class="box"><h2>4. Calibragem das avaliadoras (verificação da metodologia existente)</h2><div class="wrap"><table class="rtab"><thead><tr><th>Avaliadora</th><th>Bloco avaliado</th><th class="n">Respostas</th><th class="n">Professores</th><th class="n">Média</th><th class="n">Viés (método F1)</th><th class="n">Viés por pergunta (diagnóstico)</th></tr></thead><tbody>'+M.avals.slice().sort((a,b)=>a.vies-b.vies).map(a=>'<tr><td>'+esc(a.nome)+'</td><td>'+esc(DN[a.bloco]||a.bloco)+'</td><td class="n">'+a.n+'</td><td class="n">'+a.nprof+'</td><td class="n">'+fmt(a.mean)+'</td><td class="n">'+(a.vies>0?'+':'')+fmt(a.vies)+'</td><td class="n">'+(a.viesPerg>0?'+':'')+fmt(a.viesPerg)+'</td></tr>').join('')+'</tbody></table></div><ul><li><b>Aplicada nos segmentos anteriores?</b> Sim: mesma lógica (viés por avaliadora, ajuste de 100%). Foi mantida para garantir continuidade.</li><li><b>Distorções identificadas:</b> (i) cada avaliadora responde a <i>um</i> bloco, então o viés misturar severidade com diferença natural de dificuldade entre blocos; (ii) as avaliadoras atendem a um só segmento/unidade, de modo que o viés pode absorver diferenças reais entre equipes; (iii) as amplitudes são grandes (de '+fmt(Math.min(...M.avals.map(a=>a.vies)))+' a +'+fmt(Math.max(...M.avals.map(a=>a.vies)))+' pts), o que torna o ajuste relevante.</li><li><b>Aperfeiçoamento proposto (provisório):</b> manter o método F1 como oficial e acompanhar o “viés por pergunta” (compara a avaliadora com as demais nas <i>mesmas</i> perguntas) como diagnóstico; se a diferença entre os dois métodos persistir, recomendar uma calibragem presencial entre avaliadoras antes de ajustar estatisticamente. A nota bruta permanece visível em todos os relatórios.</li></ul></div>';
  h+='<div class="box"><h2>5. Qualidade e confiabilidade dos dados</h2><div class="stat"><div><b>'+T+'</b><span>professores nas fontes (F2/EM)</span></div><div><b>'+A+'</b><span>ativos</span></div><div><b>'+sum(p=>p.coord.n)+'</b><span>respostas válidas da coordenação</span></div><div><b>'+sum(p=>p.auto.n)+'</b><span>respostas de autoavaliação</span></div><div><b>'+sum(p=>p.tut.n)+'</b><span>respostas de tutoria dos alunos</span></div><div><b>'+sum(p=>p.idi.n)+'</b><span>respostas de idioma dos alunos</span></div><div><b>'+sum(p=>p.fam.n)+'</b><span>respostas de famílias (via tutor)</span></div><div><b>'+sum(p=>p.rec.n)+'</b><span>citações nominais atribuídas</span></div><div><b>'+sum(p=>p.com.nCom)+'</b><span>trechos de comentários atribuídos a professores</span></div></div><ul><li><b>Unificação de nomes:</b> Avanny Nassar/Nasser; Carlos Nerosky → Carlos Eduardo Rodrigues Nerosky; José Valdeci → José Valdecir; Matheus Batista Machado → Matheus Rodrigues Batista Machado; Octávio (…Ribeiro) → (…Ribeiro Pereira); Rodolfo Araya → Rodolfo Alejandro Munoz Araya; Rodrigo Oliveira → Rodrigo Eduardo de Oliveira.</li><li><b>Vínculo professor × segmento × unidade</b> conforme a base funcional do RH. Galileu, Gustavo e Marlon lecionam nos dois segmentos, mas só têm coordenação no Fund. II: dados reunidos numa linha. Nathan, Patricia e Octávio têm coordenação nos dois segmentos: duas linhas.</li><li><b>Desligados/afastados:</b> '+PR.filter(p=>!ativo(p)).map(p=>esc(tc(p.nome))).join(', ')+' — fora do quadro; notas mantidas nas médias.</li><li><b>Coordenador citado pelos alunos</b> (Marcos Leandro Matias Morris) removido da lista de professores ('+17+' citações).</li><li><b>Comentários abertos:</b> atribuição por nome/apelido dentro da unidade e do segmento do aluno; nomes ambíguos ('+D.cmeta.amb+' ocorrências) não foram atribuídos; trechos sem nome de professor ('+D.cmeta.nGeral+') ficaram sem atribuição. A classificação de tema e polaridade é automática (palavras-chave) e <b>precisa de revisão humana</b>.</li><li><b>Perguntas não comparáveis:</b> escala do Idioma (0–4) × frequência da coordenação; pergunta de famílias sobre tutoria é dupla (conhecer + comunicar). Comparações entre escalas distintas ficam sinalizadas.</li><li><b>Exposição:</b> professores com poucos alunos respondentes ficam sem a fonte de citações (&lt; 10) e, em Tutoria/Idioma, sem a fonte correspondente (&lt; 5).</li></ul></div>';
  h+='<div class="box"><h2>6. Decisões de homologação</h2><p class="foot"><b>Aprovadas pela coordenação em 28/10/2026 (aplicadas neste painel, ainda sujeitas à homologação institucional formal):</b></p><ol><li><b>Composição do IDP</b>: 50% coordenação ajustada + 50% voz externa, só para quem tem voz externa elegível.</li><li><b>Perda por desalinhamento</b> (tolerância 10, fator 0,5) comparando a coordenação geral com a voz externa.</li><li><b>Viés da avaliadora</b> do Fund. I mantido (diagnóstico alternativo na tabela de calibragem).</li><li><b>Citações dos alunos</b> incluídas como fonte da voz externa (70 + 0,3 × percentil).</li></ol><p class="foot"><b>Ainda dependem de decisão institucional:</b></p><ol start="5"><li><b>Tutoria como dimensão própria</b> (sem prejudicar quem não é tutor): entra apenas por respostas válidas da coordenação e da voz externa.</li><li>Tratar a pergunta dupla de famílias sobre o tutor como está, até haver separação nos instrumentos.</li><li>Uso dos <b>comentários</b>: só síntese e roteiro de feedback; relatos sensíveis em fluxo reservado.</li><li>Calibragem: manter método F1 e acompanhar o diagnóstico por pergunta.</li><li>Critério de mínimo de respondentes (≥ 5 externos; ≥ 10 para citações) e data de corte para professores admitidos recentemente.</li><li>Reconhecimento (IRD) como painel separado: fora deste HTML por decisão da coordenação.</li></ol></div>';
  h+='<div class="box"><h2>7. Limitações</h2><ul><li>A voz de estudantes e famílias só chega a tutores e professores de idioma; para os demais, o IDP é só da coordenação.</li><li>Número reduzido de famílias por tutor (cobertura parcial), e uma única pergunta.</li><li>Viés confundido com bloco/equipe (ver calibragem).</li><li>Comentários: amostra pequena por professor (poucos têm ≥ 5 menções); classificação automática; risco de identificação indireta de estudantes.</li><li>Sem histórico anterior para F2/EM: não há evolução de desempenho comparável.</li></ul></div>';
  h+='<div class="box"><h2>8. Funcionalidades — o que opera neste HTML e o que não opera</h2><div class="two"><div><b>Operantes</b><ul><li>Lista de professores ativos (cards ou tabela) com filtros por segmento e unidade</li><li>Diagnóstico individual com fontes, blocos, eixos e perguntas</li><li>Voz dos alunos (citações e síntese de comentários)</li><li>Tutoria e famílias</li><li>Roteiro de feedback e PDI SMART editáveis</li><li>Relatório do professor (não editável) e impressão/PDF por documento</li><li>Critérios de elegibilidade visíveis em cada IDP</li></ul></div><div><b>Limitadas (sem infraestrutura)</b><ul><li>Registro de devolutiva e acompanhamento: não há neste painel (retirado)</li><li>Edições nos campos pontilhados valem para a impressão da sessão; não são gravadas automaticamente</li><li>Controle de acesso, histórico entre ciclos e múltiplos usuários exigem servidor (não simulado)</li></ul></div></div><p class="foot">Privacidade: não publicar este arquivo em endereço público. Ele contém resultados individuais e sínteses de comentários de estudantes menores de idade.</p></div>';
  return h;
}
// ---------- impressão por documento
function printDoc(k){
  const el=document.getElementById('doc-'+k);if(!el)return;
  const cl=el.cloneNode(true);
  el.querySelectorAll('select').forEach((s,i)=>{const o=cl.querySelectorAll('select')[i];if(o)[...o.options].forEach((op,j)=>{if(s.options[j].selected)op.setAttribute('selected','')})});
  if(k==='rel')cl.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  cl.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  cl.querySelectorAll('.ed').forEach(x=>x.classList.remove('ed'));
  $('#modal').innerHTML='<div class="mb"><div class="mt noprint"><h2>Imprimir</h2><span class="sp" style="flex:1"></span><button id="mp">🖨 Imprimir / PDF</button><button id="mx">Fechar</button></div><div class="mc acao-doc">'+cl.innerHTML+'</div></div>';
  $('#modal').classList.add('open');
  $('#mx').onclick=closeDoc;$('#mp').onclick=()=>{document.body.classList.add('print-modal');window.print()};
  window.onafterprint=()=>document.body.classList.remove('print-modal');
}
function closeDoc(){$('#modal').classList.remove('open');$('#modal').innerHTML='';document.body.classList.remove('print-modal')}
// ---------- eventos
function bind(){
  const v=$('#view');
  v.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openProf(+b.dataset.open));
  v.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
  v.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printDoc(b.dataset.print));
  v.querySelectorAll('[data-f]').forEach(e=>e.onchange=e.oninput=()=>{const k=e.dataset.f;
    if(k==='selp'){S.sel=+e.value;render();return}
    S[k]=e.type==='checkbox'?e.checked:e.value;
    if(k==='fq'){const pos=e.selectionStart;render();const n=$('[data-f=fq]');n.focus();n.setSelectionRange(pos,pos);return}
    render()});
  v.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const [k,val]=b.dataset.set.split(':');S[k]=val;render()});
  v.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==='back'){S.view='prof';render()}
    if(a==='met'){S.view='met';render()}});
}
render();
</script>
