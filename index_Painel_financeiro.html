<style>

 --indigo:#9cc3ea;--teal:#86c9ae;--rose:#d98a97;--amber:#e3b45a;--sky:#86b6e0;--sand:#4a6177;--slate:#7f95a8;--semc:#d9b765;

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:8px 12px;border-radius:10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.btn:hover{border-color:var(--indigo);color:var(--indigo)}
.btn svg.i{width:16px;height:16px}.sp{flex:1}

.pb{height:9px;background:var(--grid);border-radius:99px;position:relative;margin:10px 0 3px}.pb i{display:block;height:100%;border-radius:99px;background:var(--indigo)}.pb u{position:absolute;top:-4px;width:2px;height:17px;background:var(--rose)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;white-space:nowrap}.up{background:var(--bad-bg);color:var(--bad)}.down{background:var(--good-bg);color:var(--good)}.flat{background:var(--info-bg);color:var(--ink2)}
.s-crit{background:var(--bad-bg);color:var(--bad)}.s-att{background:var(--warn-bg);color:var(--warn)}.s-ok{background:var(--good-bg);color:var(--good)}.s-sub{background:var(--soft-sky);color:var(--sky)}.s-sem{background:var(--info-bg);color:var(--semc)}.s-nd{background:var(--info-bg);color:var(--ink2)}

tr.main{cursor:pointer}tr.main:hover td{background:var(--info-bg)}tr.sub td{background:color-mix(in srgb,var(--info-bg) 55%,transparent);font-size:12.5px;color:var(--ink2)}tr.sub td:first-child{padding-left:32px}

.caret{display:inline-block;width:14px;color:var(--rose);transition:.15s}.open .caret{transform:rotate(90deg)}.code{color:var(--muted);font-size:11.5px;display:block}.tw{overflow-x:auto}.maxh{max-height:640px;overflow:auto}.maxh .tw{overflow:visible}td:first-child{min-width:210px;max-width:290px;white-space:normal}td{white-space:nowrap}.maxh thead th{position:sticky;top:0;background:var(--surface);z-index:1}

.sem{display:flex;flex-direction:column;gap:7px}.sem button{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 12px;cursor:pointer;font:inherit}

tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(b){show(b.dataset.id);window.scrollTo(0,0)}});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('fin-theme',t)}catch(e){}document.getElementById('thm').innerHTML=t==='dark'?ic('sun')+' Tema claro':ic('moon')+' Tema escuro'}
(function(){let t='light';try{t=localStorage.getItem('fin-theme')||'light'}catch(e){}setTheme(t)})();
document.getElementById('thm').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
function setPreset(id){const p=PRS.find(x=>x[0]===id);S.ms=new Set(p[2])}
function toggleM(i){if(S.ms.size===NM){S.ms=new Set([i])}else{if(S.ms.has(i))S.ms.delete(i);else S.ms.add(i);if(!S.ms.size||S.ms.size===NM)S.ms=new Set(ALLM)}}
document.addEventListener('click',e=>{const t=e.target;
 const pr=t.closest('[data-pr]');if(pr){setPreset(pr.dataset.pr);refresh();return}
 const mb=t.closest('[data-m]');if(mb&&!mb.disabled){toggleM(+mb.dataset.m);refresh();return}
 const c=t.closest('[data-clr]');if(c){const d=c.dataset.clr;if(d==='p')S.ms=new Set(ALLM);if(d==='u')S.uni='Todas';if(d==='t')S.cl='Todas';refresh();return}
 if(t.closest('#fclr')){S.ms=new Set(ALLM);S.uni='Todas';S.cl='Todas';S.st='Todos';S.q='';refresh();return}
 if(t.closest('#xall')){const on=!ALLX.every(i=>S.ex[i]);ALLX.forEach(i=>S.ex[i]=on);refresh();return}
 const xb=t.closest('[data-x]');if(xb){S.ex[xb.dataset.x]=!S.ex[xb.dataset.x];render();bar();return}
 const sc=t.closest('[data-sc]');if(sc){S.sc=sc.dataset.sc;S.P={...PRE[S.sc]};render();return}
 const st=t.closest('[data-st]');if(st){e.preventDefault();S.st=S.st===st.dataset.st&&S.page==='controle'?'Todos':st.dataset.st;if(S.page==='controle'){show('detalhe');window.scrollTo(0,0)}else render();return}
 const tt=t.closest('[data-t]');if(tt){const kk=tt.dataset.t;S[kk]=Math.max(1,Math.min(90,S[kk]+ +tt.dataset.d));render();return}
 const th=t.closest('th[data-s]');if(th){const s=th.dataset.s;S.dir=S.sort===s?-S.dir:(s==='dc'?1:-1);S.sort=s;drawTb();return}
 const tr=t.closest('tr[data-o]');if(tr){S.open[tr.dataset.o]=!S.open[tr.dataset.o];drawTb()}});
document.addEventListener('change',e=>{if(e.target.id==='fun'){S.uni=e.target.value;refresh()}else if(e.target.id==='fcl'){S.cl=e.target.value;refresh()}});
document.addEventListener('input',e=>{if(e.target.id==='tq'){S.q=e.target.value;drawTb()}});
function drawTb(){const b=document.getElementById('tbbox');if(b&&LAST)b.innerHTML=table(filt(LAST.byA),LAST.o)}
show(location.hash.slice(1)||'visao');
</script></body></html>
