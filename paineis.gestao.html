<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painéis de Gestão das Equipes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#EEF3F9;--card:#fff;--ink:#10243E;--mut:#586981;--line:#D8E1EC;--navy:#1F5FD1;--hero:#0F2A4A;--g:#DDF3E8;--gt:#0F7A57;--gl:#7CCBA8;--y:#FFEFC9;--yt:#955700;--yl:#E8B94F;--r:#FCE4E1;--rt:#B3302A;--rl:#EE9A92;--n:#E8EEF5;--nt:#5E6E84;--b:#E1ECFC;--bt:#1F5FD1;--shadow:0 1px 2px rgba(16,36,62,.06),0 4px 14px rgba(16,36,62,.05);
--fh:'Bricolage Grotesque','Figtree',system-ui,sans-serif;--fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--card:#12233A;--ink:#E7EEF8;--mut:#9DB0C8;--line:#243853;--navy:#6FA3FF;--hero:#173560;--g:#12372B;--gt:#6EDBAB;--gl:#1F7A59;--y:#3B2F12;--yt:#F2C260;--yl:#8F6A1B;--r:#43201E;--rt:#FF9B92;--rl:#9A433D;--n:#1B2E47;--nt:#9DB0C8;--b:#17325A;--bt:#9CC0F2;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--card:#12233A;--ink:#E7EEF8;--mut:#9DB0C8;--line:#243853;--navy:#6FA3FF;--hero:#173560;--g:#12372B;--gt:#6EDBAB;--gl:#1F7A59;--y:#3B2F12;--yt:#F2C260;--yl:#8F6A1B;--r:#43201E;--rt:#FF9B92;--rl:#9A433D;--n:#1B2E47;--nt:#9DB0C8;--b:#17325A;--bt:#9CC0F2;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fh);margin:0}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
button{font:inherit;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:8px}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 56px}
.hero{background:var(--hero);color:#fff;border-radius:22px;padding:34px 28px 26px;position:relative;margin-bottom:18px}
.hero .brand{display:flex;gap:8px;align-items:center;color:#A9BDD8;font-weight:600;font-size:13px;margin-bottom:12px}
.hero h1{font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.05;letter-spacing:-.015em;margin-bottom:8px;text-wrap:balance}
.hero p{margin:0;color:#A9BDD8;max-width:72ch;font-size:14.5px}
.theme{position:absolute;top:16px;right:16px;display:flex;gap:2px;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.theme button{border:0;background:none;color:#A9BDD8;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.theme button[aria-pressed="true"]{background:#fff;color:#0F2A4A}
@media(max-width:700px){.theme{position:static;margin-bottom:12px;width:max-content}.hero{padding:20px 18px}}
.tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;width:max-content;max-width:100%;box-shadow:var(--shadow)}
.tab{border:0;background:none;color:var(--mut);padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;border-radius:999px;display:flex;gap:8px;align-items:center}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.flt{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:16px 0 18px}
.flt label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mut);font-weight:600;gap:4px}
select,input[type=search]{padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 14px var(--fb);min-width:150px}
button.btn{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;font-weight:700;font-size:13.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:4px}
.kpi .l{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--mut);font-weight:600}
.kpi .l .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--n);color:var(--navy);font-size:18px;flex:none}
.kpi .v{font:800 30px/1.1 var(--fh);letter-spacing:-.01em;margin-top:4px}.kpi .s{font-size:12.5px;color:var(--mut)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.g{background:var(--g);color:var(--gt)}.pill.y{background:var(--y);color:var(--yt)}.pill.r{background:var(--r);color:var(--rt)}.pill.n{background:var(--n);color:var(--nt)}.pill.b{background:var(--b);color:var(--bt)}
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--n);gap:2px;margin:6px 0 10px}.sbar i{display:block}.sbar .g{background:var(--gl)}.sbar .y{background:var(--yl)}.sbar .r{background:var(--rl)}.sbar .n{background:var(--nt);opacity:.45}
.grp{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}.grp h2{font-size:20px;font-weight:700;display:flex;gap:9px;align-items:center}.grp h2 .ic{color:var(--navy)}.grp span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;background:var(--card);border:1px solid var(--line);border-top:5px solid var(--nt);border-radius:14px;padding:13px 15px;cursor:pointer;text-align:left;font:inherit;color:inherit;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,36,62,.14)}
.card.g{border-top-color:var(--gl)}.card.y{border-top-color:var(--yl)}.card.r{border-top-color:var(--rl)}.card.n{border-top-color:var(--line)}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.card .t{font:700 18px var(--fh)}.card .m{font-size:12.5px;color:var(--mut);margin:2px 0 9px}
.ln{display:flex;gap:8px;align-items:baseline;font-size:13.5px;margin:3px 0}.ln b{min-width:76px;color:var(--mut);font-weight:600;font-size:12.5px}
.miss{border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--rt);background:var(--r);margin:5px 0}
.foot{margin-top:8px;font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.af{text-decoration:line-through;color:var(--rt)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--card);font-size:12.5px;color:var(--mut);font-weight:700;position:sticky;top:0}
tr.row{cursor:pointer}tr.row:hover td{background:var(--n)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:12px;box-shadow:var(--shadow)}.box h3{font-size:17px;margin-bottom:8px}
.alert{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}.alert .pill{align-self:flex-start;white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--mut)}.empty{padding:30px;text-align:center;color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--n);overflow:hidden}.bar i{display:block;height:100%;background:var(--gt)}
.leg{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px;font-size:12.5px;align-items:center}
.disc{display:flex;gap:6px;flex-wrap:wrap}.disc span{padding:3px 9px;border-radius:9px;font-size:12.5px;font-weight:600}
@media(max-width:700px){.tabs{width:100%;flex-wrap:nowrap;overflow-x:auto;border-radius:16px}.tab{white-space:nowrap;padding:9px 12px}.flt label{flex:1 1 140px}.flt select,.flt input[type=search]{width:100%}.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.flt,.tabs,.btn,.theme{display:none}body{background:#fff}}
</style></head><body>

const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const LBL={g:'Equipe completa',y:'Pendente de validação',r:'Equipe incompleta',n:'Sem regra de composição'};
const rule=t=>['K','K5','EF1'].includes(t.sg);
const auxNeed=t=>t.sg==='EF1'?(/^[45]º/.test(t.serie)?0.5:1):(rule(t)?1:0);
function calc(t){
 const miss=[];const act=t.reg.filter(x=>x[2]==='ok');
 if(rule(t)){
  if(t.sg==='K'){if(!act.some(x=>x[1]==='ÚN'))miss.push('Sem regente de turma');}
  else{if(!act.some(x=>x[1]==='PT'))miss.push('Sem regente de Língua Portuguesa');if(!act.some(x=>x[1]==='EN'))miss.push('Sem regente de Língua Inglesa');}
  t.falta.forEach(d=>miss.push('Falta '+(d==='Língua Portuguesa'?d:'especialista de '+d)+' ('+(t.req.length-t.falta.length)+' de '+t.req.length+' disciplinas cobertas)'));
 }
 const auxMiss=rule(t)&&auxNeed(t)>=1&&t.aux.length===0&&!t.rod.length;
 let c='n';
 if(rule(t)){c=(miss.length||auxMiss)?'r':((t.fl.length||t.necN>t.des||t.inv)?'y':'g');}
 return {miss,auxMiss,c};
}
T.forEach(t=>Object.assign(t,{_:calc(t)}));
const vis=()=>{const u=$('#fu').value,s=$('#fs').value,p=$('#fp').value,q=$('#fq').value.trim().toLowerCase();

function profs(t){const L=t.comp.filter(p=>p.st!=='Afastado');const ds=[...new Set(L.map(p=>p.d||p.f))];return `<div class="ln"><b>Professores</b><span>${new Set(L.map(p=>p.n)).size} vinculados · ${ds.length} componentes</span></div><div class="note" style="margin-bottom:4px">${[...new Set(L.map(p=>p.n))].slice(0,4).map(esc).join(', ')}${new Set(L.map(p=>p.n)).size>4?' e outros':''}</div>`;}

 <div class="foot"><span>${t.sg==='K'||t.sg==='K5'?(t.req.length-t.falta.length)+' de '+t.req.length+' disciplinas de especialistas':t.espN+(rule(t)?' especialistas':' professores por componente')}</span>${t.fl.length?`<span class="pill y" title="${esc(t.fl.join(' | '))}">${t.fl.length} a validar</span>`:''}</div>
 <div class="foot"><span>Apoio: ${t.necN?t.des+' de '+t.necN+' designados':'sem necessidade identificada'}${t.inv?' · '+t.inv+' em investigação':''}</span></div></button>`;}
function vComp(){const L=vis();let h=kpis(L);if(!L.length)return h+'<div class="empty">Nenhuma turma para os filtros escolhidos.</div>';
 const G={};L.forEach(t=>{(G[gname(t)]=G[gname(t)]||[]).push(t)});
 Object.entries(G).forEach(([k,v])=>{h+=`<div class="grp"><h2>${k}</h2><span>${v.length} turmas</span></div><div class="grid">${v.map(card).join('')}</div>`});return h;}
function cobStatus(t){if(!t.necN&&!t.inv)return ['n','Sem necessidade identificada'];if(t.necN>t.des)return ['r','Descoberto: '+(t.necN-t.des)+' sem profissional'];
 if(t.hcob<t.hprev)return ['y','Parcial: déficit de '+(t.hprev-t.hcob)+' h'];if(!t.necN)return ['n','Somente em investigação'];return ['b','Horas suficientes · janela de aula não verificada'];}
function vCob(){const L=vis();
 const ap=L.reduce((s,t)=>s+t.necN,0),des=L.reduce((s,t)=>s+t.des,0);
 const al=[];
 SH.filter(s=>s.ts.some(x=>L.some(t=>t.t===x))).forEach(s=>al.push(['y','Compartilhado',s.n,'Atende '+s.ts.join(', ')+(s.ts.length>2?' (acúmulo de '+s.ts.length+' turmas)':'')+'. Falta horário por turma para verificar a cobertura.']));
 L.filter(t=>t.necN>t.des).forEach(t=>al.push(['r','Descoberto',t.t,t.nec.filter(n=>/Vaga/.test(n.prof)).map(n=>n.cod).join(', ')+': vaga em contratação, sem profissional designado.']));
 L.filter(t=>t.inv).forEach(t=>al.push(['n','Em investigação',t.t,t.nec.filter(n=>/investiga/i.test(n.doc)).map(n=>n.cod).join(', ')+': definir acompanhamento após o laudo.']));
 const semH=L.flatMap(t=>t.aux.filter(a=>!a.ch&&!a.ent).map(a=>a.n));
 const kd=L.filter(t=>t.falta.length);
 kd.forEach(t=>al.push(['r','Disciplina',t.t,'Falta '+t.falta.join(', ')]));
 return `<div class="kpis"><div class="kpi"><div class="l">Acompanhamentos necessários</div><div class="v">${ap}</div><div class="s">${des} com profissional · ${ap-des} sem</div></div>
 <div class="kpi"><div class="l">Cobertura validada</div><div class="v">0</div><div class="s">exige horário de aula da turma e horário do profissional</div></div>
 <div class="kpi"><div class="l">Auxiliares sem carga/horário</div><div class="v">${new Set(semH).size}</div><div class="s">informação a enviar</div></div>
 <div class="kpi"><div class="l">Profissionais compartilhados</div><div class="v">${SH.length}</div><div class="s">auxiliares em mais de uma turma</div></div></div>
 <div class="box"><h3>Alertas de alocação e cobertura</h3>${al.map(a=>`<div class="alert"><span class="pill ${a[0]}">${a[1]}</span><div><b>${esc(a[2])}</b><br><span class="note" style="font-size:13px">${esc(a[3])}</span></div></div>`).join('')||'<div class="note">Nenhum alerta.</div>'}</div>
 <div class="box"><h3>Auxiliares volantes</h3>${VOL.map(v=>`<div class="alert"><span class="pill b">${v.u}</span><div><b>${esc(v.n)}</b><br><span class="note">${esc(v.outras||'')}${v.ch?' · '+v.ch+' h':''}</span></div></div>`).join('')||'<div class="note">Nenhum.</div>'}</div>
 <div class="box"><h3>Cobertura do apoio por turma</h3><p class="note">“Designado” não significa “coberto”: sem o horário de aula e o horário do profissional, a cobertura não é validada. As horas abaixo são carga semanal prevista × carga semanal do profissional designado.</p>
 <div style="overflow:auto"><table><thead><tr><th>Turma</th><th>Apoio (necess. · design.)</th><th>Horas previstas</th><th>Horas designadas</th><th>Situação</th></tr></thead><tbody>${L.filter(t=>t.necN||t.inv).map(t=>{const s=cobStatus(t);return `<tr class="row" data-t="${esc(t.t)}"><td><b>${esc(t.t)}</b><br><span class="note">${t.u}</span></td><td>${t.necN} · ${t.des}${t.inv?' (+'+t.inv+' investigação)':''}</td><td>${t.hprev} h</td><td>${t.hcob} h</td><td><span class="pill ${s[0]}">${s[1]}</span></td></tr>`}).join('')}</tbody></table></div></div>`;}
function vDet(){const t=sel&&T.find(x=>x.t===sel)||vis()[0]||T[0];sel=t.t;const c=t._;
 const opts=T.map(x=>`<option ${x.t===t.t?'selected':''}>${esc(x.t)}</option>`).join('');
 const person=(n,r,st,extra)=>`<div class="alert"><div style="flex:1"><b class="${st==='Afastado'?'af':''}">${esc(n)}</b> <span class="note">· ${esc(r)}${extra?' · '+esc(extra):''}</span></div><span class="pill ${st==='Afastado'?'r':'g'}">${st==='Afastado'?'Afastado(a)':'Ativo'}</span></div>`;
 return `<div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center"><div><h2>${esc(t.t)}</h2><div class="note">${t.u} · ${SG[t.sg]} · ${t.al} de ${t.cap} alunos (${Math.round(100*t.al/t.cap)}%) · ${t.turno==='A informar'?'turno a informar':esc(t.turno)} · ${t.lau} estudante(s) com laudo</div></div>
 <div><label class="note">Trocar turma <select id="dsel">${opts}</select></label> <span class="pill ${c.c}" style="font-size:13px">${LBL[c.c]}</span></div></div></div>
 ${c.miss.concat(c.auxMiss?['Sem auxiliar designado']:[]).map(m=>`<div class="miss">${esc(m)}</div>`).join('')}
 ${t.fl.length?`<div class="box"><h3>A validar (${t.fl.length})</h3>${t.fl.map(f=>`<div class="alert"><span class="pill y">Confirmar</span><div>${esc(f)}</div></div>`).join('')}</div>`:''}
 <div class="two"><div class="box"><h3>Regentes</h3>${t.regs.map(r=>person(r.n,r.f,r.st,(r.ch?r.ch+' h':'carga não informada'))).join('')||'<div class="note">'+(rule(t)?'Nenhum regente designado.':'Sem regente: Ensino Fundamental II e Médio têm professores por componente.')+'</div>'}
 <h3 style="margin-top:12px">${rule(t)?'Especialistas / professores de componente':'Professores por componente'}</h3>${t.comp.map(r=>person(r.n,r.d||r.f,r.st,r.ch?r.ch+' h':'')).join('')||'<div class="note">Nenhum vínculo cadastrado.</div>'}
 ${t.req.length?`<h3 style="margin-top:12px">Disciplinas exigidas (${t.req.length-t.falta.length} de ${t.req.length})</h3><div class="disc">${t.req.map(d=>`<span class="pill ${t.falta.includes(d)?'r':'g'}" title="${esc((t.cov[d]||[]).join(', '))}">${d}${t.falta.includes(d)?' · falta':''}</span>`).join('')}</div>`:''}</div>
 <div><div class="box"><h3>Auxiliares</h3>${t.aux.map(a=>person(a.n,a.c+(a.outras?' · '+a.outras:''),a.st,a.ch?a.ch+' h'+(a.ent?' · '+fh(a.ent)+'–'+fh(a.sai):''):'carga/horário não informado')).join('')||'<div class="note">Nenhum auxiliar fixo.</div>'}
 ${t.rod.length?`<div class="note" style="margin-top:6px">Volantes em rodízio: ${t.rod.map(esc).join(', ')}</div>`:''}</div>
 <div class="box"><h3>Estagiários e apoio a estudantes</h3>${t.est.map(e=>person(e.n,e.c+' · '+e.mod,e.st,(e.ch||'?')+' h'+(e.cod?' · '+e.cod:''))).join('')||'<div class="note">Nenhum estagiário vinculado à turma.</div>'}
 ${t.nec.length?`<table style="margin-top:8px"><thead><tr><th>Estudante</th><th>Situação do laudo</th><th>Profissional</th></tr></thead><tbody>${t.nec.map(n=>`<tr><td>${esc(n.cod)}</td><td>${esc(n.doc)}</td><td>${n.prof?(/Vaga/.test(n.prof)?'<span class="pill r">Vaga em contratação</span>':esc(n.prof)):'<span class="note">'+(n.ind==='Sem informação na origem'||/investig/i.test(n.doc)?'sem indicação':'—')+'</span>'}</td></tr>`).join('')}</tbody></table>`:''}</div></div></div>`;}
const fh=x=>{const h=Math.floor(x),m=Math.round((x-h)*60);return h+'h'+(m?String(m).padStart(2,'0'):'')};

const ICMAP=[[/Turmas|Acompanhamentos/,'grid'],[/incompleta|Descoberto/,'alert'],[/completa|validada|Cobertura/,'check'],[/Pendente|sem carga|Auxiliares sem/,'clock'],[/Sem regra/,'file'],[/Apoio|apoio/,'heart'],[/compartilhados/,'link']];
function decorate(){
 document.querySelectorAll('.kpi .l').forEach(e=>{if(e.querySelector('.ico'))return;const m=ICMAP.find(x=>x[0].test(e.textContent));e.innerHTML='<span class="ico"><svg class="ic"><use href="#i-'+(m?m[1]:'grid')+'"/></svg></span><span>'+e.innerHTML+'</span>';});
 const lg=document.querySelector('.leg');if(lg&&view==='comp'&&!document.querySelector('.sbar')){const L=vis().filter(t=>rule(t)),all=vis(),c=k=>all.filter(t=>t._.c===k).length;
  lg.insertAdjacentHTML('beforebegin','<div class="sbar" role="img" aria-label="Composição das equipes">'+['g','y','r','n'].map(k=>c(k)?'<i class="'+k+'" style="flex:'+c(k)+'"></i>':'').join('')+'</div>');}
 document.querySelectorAll('.grp h2').forEach(h=>{if(!h.querySelector('.ic'))h.insertAdjacentHTML('afterbegin','<svg class="ic"><use href="#i-grid"/></svg>')});
}
function draw(){$('#app').innerHTML=view==='comp'?vComp():view==='cob'?vCob():vDet();
 document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{sel=e.dataset.t;view='det';sync();});
 const d=$('#dsel');if(d)d.onchange=()=>{sel=d.value;draw();};decorate();}
function sync(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));draw();window.scrollTo(0,0);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;sync();});
['fu','fs','fp','fq'].forEach(i=>$('#'+i).oninput=()=>{if(view==='det')view='comp';sync();});
$('#csv').onclick=()=>{const rows=[['Unidade','Turma','Segmento','Situação','Regentes','Auxiliares','Disciplinas faltando','Apoios necessários','Apoios designados','A validar','Professores vinculados (sem regra)']];
 vis().forEach(t=>rows.push([t.u,t.t,SG[t.sg],LBL[t._.c],t.reg.map(r=>r[0]+(r[2]==='af'?' (afastado)':'')).join('; '),t.aux.map(a=>a.n).join('; '),t.falta.join('; '),t.necN,t.des,t.fl.join(' | '),rule(t)?'':[...new Set(t.comp.map(p=>p.n))].join('; ')]));
 const b=new Blob(['﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='composicao_turmas.csv';a.click();};
draw();
</script><script>(function(){var r=document.documentElement,K='tema-paineis';function set(t,s){if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);document.querySelectorAll('.theme button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.t===t))});if(s){try{localStorage.setItem(K,t)}catch(e){}}}
var v='auto';try{v=localStorage.getItem(K)||'auto'}catch(e){}set(v,false);document.querySelector('.theme').addEventListener('click',function(e){var b=e.target.closest('button');if(b)set(b.dataset.t,true)})})();</script></body></html>
