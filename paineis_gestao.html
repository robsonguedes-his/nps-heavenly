.theme{position:absolute;top:22px;right:0;display:flex;gap:6px}.theme button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;font:600 12.5px inherit}.theme button[aria-pressed="true"]{background:var(--navy);color:var(--bg);border-color:var(--navy)}@media(max-width:700px){.theme{position:static;margin-bottom:8px}}@media print{.theme{display:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--n);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}

.miss{border:1.5px dashed #C0392B;border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:600;color:var(--rt);background:var(--r);margin:4px 0}
.foot{margin-top:8px;font-size:11.5px;color:var(--mut);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.af{text-decoration:line-through;color:var(--rt)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--n);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--nt);position:sticky;top:0}

 ${rule(t)?`<div class="ln"><b>Auxiliar</b><span>${ax||(t.rod.length?'volantes em rodízio':'—')}</span></div>`:''}
 ${t._.miss.map(m=>`<div class="miss">${esc(m)}</div>`).join('')}${t._.auxMiss?'<div class="miss">Sem auxiliar designado</div>':''}
 <div class="foot"><span>${t.sg==='K'||t.sg==='K5'?(t.req.length-t.falta.length)+' de '+t.req.length+' disciplinas de especialistas':t.espN+(rule(t)?' especialistas':' professores por componente')}</span>${t.fl.length?`<span class="pill y" title="${esc(t.fl.join(' | '))}">${t.fl.length} a validar</span>`:''}</div>
 <div class="foot"><span>Apoio: ${t.necN?t.des+' de '+t.necN+' designados':'sem necessidade identificada'}${t.inv?' · '+t.inv+' em investigação':''}</span></div></button>`;}
function vComp(){const L=vis();let h=kpis(L);if(!L.length)return h+'<div class="empty">Nenhuma turma para os filtros escolhidos.</div>';
 const G={};L.forEach(t=>{(G[gname(t)]=G[gname(t)]||[]).push(t)});
 Object.entries(G).forEach(([k,v])=>{h+=`<div class="grp"><h2>${k}</h2><span>${v.length} turmas</span></div><div class="grid">${v.map(card).join('')}</div>`});return h;}
function cobStatus(t){if(!t.necN&&!t.inv)return ['n','Sem necessidade identificada'];if(t.necN>t.des)return ['r','Descoberto: '+(t.necN-t.des)+' sem profissional'];
 if(t.hcob<t.hprev)return ['y','Parcial: déficit de '+(t.hprev-t.hcob)+' h'];if(!t.necN)return ['n','Somente em investigação'];return ['b','Horas suficientes · janela de aula não verificada'];}
function vCob(){const L=vis();
 const ap=L.reduce((s,t)=>s+t.necN,0),des=L.reduce((s,t)=>s+t.des,0);
 const al=[];
 SH.filter(s=>s.ts.some(x=>L.some(t=>t.t===x))).forEach(s=>al.push(['y','Compartilhado',s.n,'Atende '+s.ts.join(', ')+(s.ts.length>2?' (acúmulo de '+s.ts.length+' turmas)':'')+'. Falta horário por turma para verificar a cobertura.']));
 L.filter(t=>t.necN>t.des).forEach(t=>al.push(['r','Descoberto',t.t,t.nec.filter(n=>/Vaga/.test(n.prof)).map(n=>n.cod).join(', ')+': vaga em contratação, sem profissional designado.']));
 L.filter(t=>t.inv).forEach(t=>al.push(['n','Em investigação',t.t,t.nec.filter(n=>/investiga/i.test(n.doc)).map(n=>n.cod).join(', ')+': definir acompanhamento após o laudo.']));
 const semH=L.flatMap(t=>t.aux.filter(a=>!a.ch&&!a.ent).map(a=>a.n));
 const kd=L.filter(t=>t.falta.length);
 kd.forEach(t=>al.push(['r','Disciplina',t.t,'Falta '+t.falta.join(', ')]));
 return `<div class="kpis"><div class="kpi"><div class="l">Acompanhamentos necessários</div><div class="v">${ap}</div><div class="s">${des} com profissional · ${ap-des} sem</div></div>
 <div class="kpi"><div class="l">Cobertura validada</div><div class="v">0</div><div class="s">exige horário de aula da turma e horário do profissional</div></div>
 <div class="kpi"><div class="l">Auxiliares sem carga/horário</div><div class="v">${new Set(semH).size}</div><div class="s">informação a enviar</div></div>
 <div class="kpi"><div class="l">Profissionais compartilhados</div><div class="v">${SH.length}</div><div class="s">auxiliares em mais de uma turma</div></div></div>
 <div class="box"><h3>Alertas de alocação e cobertura</h3>${al.map(a=>`<div class="alert"><span class="pill ${a[0]}">${a[1]}</span><div><b>${esc(a[2])}</b><br><span class="note" style="font-size:13px">${esc(a[3])}</span></div></div>`).join('')||'<div class="note">Nenhum alerta.</div>'}</div>
 <div class="box"><h3>Auxiliares volantes</h3>${VOL.map(v=>`<div class="alert"><span class="pill b">${v.u}</span><div><b>${esc(v.n)}</b><br><span class="note">${esc(v.outras||'')}${v.ch?' · '+v.ch+' h':''}</span></div></div>`).join('')||'<div class="note">Nenhum.</div>'}</div>
 <div class="box"><h3>Cobertura do apoio por turma</h3><p class="note">“Designado” não significa “coberto”: sem o horário de aula e o horário do profissional, a cobertura não é validada. As horas abaixo são carga semanal prevista × carga semanal do profissional designado.</p>
 <div style="overflow:auto"><table><thead><tr><th>Turma</th><th>Apoio (necess. · design.)</th><th>Horas previstas</th><th>Horas designadas</th><th>Situação</th></tr></thead><tbody>${L.filter(t=>t.necN||t.inv).map(t=>{const s=cobStatus(t);return `<tr class="row" data-t="${esc(t.t)}"><td><b>${esc(t.t)}</b><br><span class="note">${t.u}</span></td><td>${t.necN} · ${t.des}${t.inv?' (+'+t.inv+' investigação)':''}</td><td>${t.hprev} h</td><td>${t.hcob} h</td><td><span class="pill ${s[0]}">${s[1]}</span></td></tr>`}).join('')}</tbody></table></div></div>`;}
function vDet(){const t=sel&&T.find(x=>x.t===sel)||vis()[0]||T[0];sel=t.t;const c=t._;
 const opts=T.map(x=>`<option ${x.t===t.t?'selected':''}>${esc(x.t)}</option>`).join('');
 const person=(n,r,st,extra)=>`<div class="alert"><div style="flex:1"><b class="${st==='Afastado'?'af':''}">${esc(n)}</b> <span class="note">· ${esc(r)}${extra?' · '+esc(extra):''}</span></div><span class="pill ${st==='Afastado'?'r':'g'}">${st==='Afastado'?'Afastado(a)':'Ativo'}</span></div>`;
 return `<div class="box"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;align-items:center"><div><h2>${esc(t.t)}</h2><div class="note">${t.u} · ${SG[t.sg]} · ${t.al} de ${t.cap} alunos (${Math.round(100*t.al/t.cap)}%) · ${t.turno==='A informar'?'turno a informar':esc(t.turno)} · ${t.lau} estudante(s) com laudo</div></div>
 <div><label class="note">Trocar turma <select id="dsel">${opts}</select></label> <span class="pill ${c.c}" style="font-size:13px">${LBL[c.c]}</span></div></div></div>
 ${c.miss.concat(c.auxMiss?['Sem auxiliar designado']:[]).map(m=>`<div class="miss">${esc(m)}</div>`).join('')}
 ${t.fl.length?`<div class="box"><h3>A validar (${t.fl.length})</h3>${t.fl.map(f=>`<div class="alert"><span class="pill y">Confirmar</span><div>${esc(f)}</div></div>`).join('')}</div>`:''}
 <div class="two"><div class="box"><h3>Regentes</h3>${t.regs.map(r=>person(r.n,r.f,r.st,(r.ch?r.ch+' h':'carga não informada'))).join('')||'<div class="note">'+(rule(t)?'Nenhum regente designado.':'Sem regente: Ensino Fundamental II e Médio têm professores por componente.')+'</div>'}
 <h3 style="margin-top:12px">${rule(t)?'Especialistas / professores de componente':'Professores por componente'}</h3>${t.comp.map(r=>person(r.n,r.d||r.f,r.st,r.ch?r.ch+' h':'')).join('')||'<div class="note">Nenhum vínculo cadastrado.</div>'}
 ${t.req.length?`<h3 style="margin-top:12px">Disciplinas exigidas (${t.req.length-t.falta.length} de ${t.req.length})</h3><div class="disc">${t.req.map(d=>`<span class="pill ${t.falta.includes(d)?'r':'g'}" title="${esc((t.cov[d]||[]).join(', '))}">${d}${t.falta.includes(d)?' · falta':''}</span>`).join('')}</div>`:''}</div>
 <div><div class="box"><h3>Auxiliares</h3>${t.aux.map(a=>person(a.n,a.c+(a.outras?' · '+a.outras:''),a.st,a.ch?a.ch+' h'+(a.ent?' · '+fh(a.ent)+'–'+fh(a.sai):''):'carga/horário não informado')).join('')||'<div class="note">Nenhum auxiliar fixo.</div>'}
 ${t.rod.length?`<div class="note" style="margin-top:6px">Volantes em rodízio: ${t.rod.map(esc).join(', ')}</div>`:''}</div>
 <div class="box"><h3>Estagiários e apoio a estudantes</h3>${t.est.map(e=>person(e.n,e.c+' · '+e.mod,e.st,(e.ch||'?')+' h'+(e.cod?' · '+e.cod:''))).join('')||'<div class="note">Nenhum estagiário vinculado à turma.</div>'}
 ${t.nec.length?`<table style="margin-top:8px"><thead><tr><th>Estudante</th><th>Situação do laudo</th><th>Profissional</th></tr></thead><tbody>${t.nec.map(n=>`<tr><td>${esc(n.cod)}</td><td>${esc(n.doc)}</td><td>${n.prof?(/Vaga/.test(n.prof)?'<span class="pill r">Vaga em contratação</span>':esc(n.prof)):'<span class="note">'+(n.ind==='Sem informação na origem'||/investig/i.test(n.doc)?'sem indicação':'—')+'</span>'}</td></tr>`).join('')}</tbody></table>`:''}</div></div></div>`;}
const fh=x=>{const h=Math.floor(x),m=Math.round((x-h)*60);return h+'h'+(m?String(m).padStart(2,'0'):'')};
function draw(){$('#app').innerHTML=view==='comp'?vComp():view==='cob'?vCob():vDet();
 document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{sel=e.dataset.t;view='det';sync();});
 const d=$('#dsel');if(d)d.onchange=()=>{sel=d.value;draw();};}
function sync(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===view));draw();window.scrollTo(0,0);}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.v;sync();});
['fu','fs','fp','fq'].forEach(i=>$('#'+i).oninput=()=>{if(view==='det')view='comp';sync();});
$('#csv').onclick=()=>{const rows=[['Unidade','Turma','Segmento','Situação','Regentes','Auxiliares','Disciplinas faltando','Apoios necessários','Apoios designados','A validar','Professores vinculados (sem regra)']];
 vis().forEach(t=>rows.push([t.u,t.t,SG[t.sg],LBL[t._.c],t.reg.map(r=>r[0]+(r[2]==='af'?' (afastado)':'')).join('; '),t.aux.map(a=>a.n).join('; '),t.falta.join('; '),t.necN,t.des,t.fl.join(' | '),rule(t)?'':[...new Set(t.comp.map(p=>p.n))].join('; ')]));
 const b=new Blob(['﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='composicao_turmas.csv';a.click();};
draw();
</script><script>(function(){var r=document.documentElement,K='tema-paineis';function set(t,s){if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);document.querySelectorAll('.theme button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.t===t))});if(s){try{localStorage.setItem(K,t)}catch(e){}}}
var v='auto';try{v=localStorage.getItem(K)||'auto'}catch(e){}set(v,false);document.querySelector('.theme').addEventListener('click',function(e){var b=e.target.closest('button');if(b)set(b.dataset.t,true)})})();</script></body></html>
